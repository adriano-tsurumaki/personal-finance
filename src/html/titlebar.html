<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance — Window controls</title>
  </head>
  <body>
    <header id="titlebar">
      <div class="drag-region">
        <span class="app-title">Personal Finance</span>
      </div>

      <div class="window-controls">
        <button id="window-minimize" class="window-button" aria-label="Minimize">&#xE921;</button>
        <button id="window-maximize" class="window-button" aria-label="Maximize">&#xE922;</button>
        <button id="window-close" class="window-button close" aria-label="Close">&#xE8BB;</button>
      </div>
    </header>

    <script type="module" src="/src/titlebar/main.ts"></script>
  </body>
</html>
